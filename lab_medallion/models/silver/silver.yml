models:
- name: stg_users
  description: Cleaned and typed users with address components.
  columns:
  - name: user_id
    data_tests:
    - unique
    - not_null
  - name: email
    data_tests:
    - unique
    - not_null
  - name: sex
    data_tests:
    - accepted_values:
        arguments:
          values:
          - F
          - M
  - name: state
    data_tests:
    - not_null
  - name: username_normalized
    description: Username in lowercase without leading or trailing whitespace.
    data_tests:
    - not_null
  - name: birthdate_is_valid
    description: False when the original birthdate is missing or later than the user's
      first order.
    data_tests:
    - not_null
- name: stg_orders
  description: Typed and deduplicated orders.
  columns:
  - name: order_id
    data_tests:
    - unique
    - not_null
  - name: user_id
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_users')
          field: user_id
  - name: quantity
    data_tests:
    - accepted_values:
        arguments:
          values:
          - 1
          - 2
          - 3
          - 4
          - 5
          quote: false
  - name: product
    data_tests:
    - accepted_values:
        arguments:
          values:
          - bread
          - brioche
          - cookie
          - croissant
          - donut
          - drink
